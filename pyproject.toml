[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muzifikator"
version = "0.1.0"
description = "Озвучка текста поверх локально сгенерированной музыки"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.20.1",
  "edge-tts>=7",
  "numpy>=1.26,<2",
  "torch>=2.15.0",
  "transformers>=5.24.1",
  "utaupy>=1.22.1",
  "pyworld>=0.3.5",
  "soundfile>=0.14.0",
  "librosa>=0.10",
  "pyloudnorm>=0.1",
  "nnmnkwii>=0.1",
  "scikit-learn>=1.3",
  "omegaconf>=2.3",
  "hydra-core>=1.3",
  "pyyaml>=6",
  "setuptools<81",
  "h5py>=3.16.0",
  "matplotlib<3.9",
]

[project.scripts]
muzifikator = "muzifikator.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx2>=2.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/muzifikator"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/muzifikator",
  "/pyproject.toml",
  "/README.md",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.mypy]
files = ["src"]
strict = true
python_version = "3.12"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "soundfile", "enunu_steps"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not model'"
markers = [
  "network: обращается к внешнему сервису edge-tts; запускается вручную через -m network",
  "model: загружает веса MusicGen и считает на устройстве; вручную через -m model",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["vendor", ".venv", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
