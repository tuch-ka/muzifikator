<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>muzifikator</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>muzifikator</h1>
  <p class="hint">Текст на музыку: озвучка, подложка и микс в один файл.</p>

  <form id="generation-form" autocomplete="off">
    <label for="text">Текст</label>
    <textarea id="text" name="text" rows="8" required placeholder="Что озвучить"></textarea>

    <div class="row">
      <label for="mode">Режим</label>
      <select id="mode" name="mode">
        <option value="song">Песня</option>
        <option value="narrated">Озвучка</option>
      </select>
    </div>

    <div class="row">
      <label for="voice">Голос</label>
      <select id="voice" name="voice"></select>
    </div>

    <div class="row">
      <label for="tags">Теги музыки</label>
      <input id="tags" name="tags" type="text" placeholder="folk metal">
    </div>

    <div class="actions">
      <button id="submit" type="submit">Сгенерировать</button>
      <button id="regenerate" type="button" disabled>Перегенерировать</button>
      <button id="save-settings" type="button" class="secondary">Сохранить настройки</button>
    </div>
  </form>

  <p id="message" role="status" aria-live="polite"></p>

  <section id="status" hidden>
    <p id="status-text"></p>
    <div class="bar"><div id="status-bar"></div></div>
  </section>

  <section id="result" hidden>
    <h2>Результат</h2>
    <ul id="result-files"></ul>
  </section>

  <section id="storage">
    <h2>Каталог хранения</h2>
    <p id="storage-path" class="hint"></p>
    <button id="storage-edit" type="button" class="secondary">Изменить</button>
    <div id="storage-browser" hidden>
      <p id="browser-path" class="hint"></p>
      <div class="actions">
        <button id="browser-up" type="button" class="secondary">Выше</button>
        <button id="browser-use" type="button">Выбрать этот каталог</button>
        <button id="browser-close" type="button" class="secondary">Закрыть</button>
      </div>
      <ul id="browser-list"></ul>
      <div class="row">
        <label for="browser-manual">Или введите абсолютный путь</label>
        <input id="browser-manual" type="text" placeholder="/Users/you/muzifikator">
      </div>
      <div class="actions">
        <button id="browser-manual-use" type="button">Использовать путь</button>
      </div>
    </div>
  </section>

  <section id="files">
    <h2>Файлы</h2>
    <audio id="player" controls preload="none" hidden></audio>
    <ul id="files-list"></ul>
    <button id="files-more" type="button" class="secondary" hidden>Показать ещё</button>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
